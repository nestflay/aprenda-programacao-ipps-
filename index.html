<title>Aprenda a Programação da Melhor Forma</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f8;--card:#fff;--ink:#0a0a0a;--mute:#52586b;--line:#d3d8e4;--pri:#0b2f8a;--onpri:#fff;--red:#d90000;--gold:#f2b705;--ok:#137a45;--bad:#c4161c;--code:#0b1330;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#131c38;--ink:#f2f4fa;--mute:#a4adc8;--line:#2a3558;--pri:#3b6bff;--code:#060a18}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#131c38;--ink:#f2f4fa;--mute:#a4adc8;--line:#2a3558;--pri:#3b6bff;--code:#060a18}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 Sora,system-ui,sans-serif;display:flex;justify-content:center;padding:14px}
#app{width:100%;max-width:620px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font:700 clamp(22px,6.5vw,30px)/1.2 Sora,system-ui,sans-serif;margin:10px 0 6px}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:16px;margin:0}
.mute{color:var(--mute)}.sm{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.lg{background:#fff;border-radius:12px;padding:4px 8px;display:inline-block;line-height:0}
.lg img{height:46px;width:auto}
.lg.big{padding:8px 14px}.lg.big img{height:96px}
.hero{text-align:center}
.card,.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.cl{border-left:6px solid var(--red)}
button{font:600 15px Sora,system-ui,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.go{background:var(--pri);border-color:var(--pri);color:var(--onpri);width:100%;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
label{display:block;text-align:left;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font:500 16px Sora,system-ui,sans-serif;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink)}
textarea{font:500 12px "JetBrains Mono",monospace;height:110px}
.err{color:var(--bad);font-weight:600;min-height:22px;font-size:14px;margin-top:6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chips div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px;color:var(--mute);text-align:center}
.chips b{display:block;font-size:20px;color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
pre{background:var(--code);color:#f2f4fa;font:500 13px/1.6 "JetBrains Mono",monospace;padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.tag{display:inline-block;background:var(--gold);color:#0a0a0a;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:14px}
.opt.r{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.w{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{font-size:14px;margin:6px 0;min-height:22px}
.lv{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lv button{width:auto;margin:0}
a.vb{display:inline-block;background:var(--pri);color:var(--onpri);text-decoration:none;font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.sc{overflow-x:auto}
.big2{font-size:42px;text-align:center;margin:8px 0}.hero{position:relative}.ab{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;padding:0;font-size:20px}.lgc{justify-content:center;margin:10px 0 6px}.demo{min-height:140px;text-align:left;font-size:13px;margin:0 0 6px}.ok2{color:#7ddc9a;font-weight:700}.cd{font:500 14px/1.5 "JetBrains Mono",monospace;height:220px;white-space:pre;overflow:auto;tab-size:2}.sm2{height:70px}.out{min-height:90px;white-space:pre-wrap;margin:10px 0 0}.er{color:#ff8a8a;font-weight:700}body{padding-bottom:90px}
.ide{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#0b1330;margin-top:8px}.ide:focus-within{outline:3px solid var(--gold)}
.gt,#hl,#src{font:500 13px/20px "JetBrains Mono",monospace;tab-size:2;letter-spacing:0}
.gt{width:40px;flex:none;color:#7f8bb0;text-align:right;padding:10px 6px;overflow:hidden;white-space:pre;user-select:none;background:rgba(255,255,255,.05)}
.ew{position:relative;flex:1;min-width:0;height:280px}
#hl{position:absolute;inset:0;margin:0;padding:10px;overflow:hidden;color:#e8ecff;pointer-events:none;white-space:pre;background:transparent}
#src{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:#fff;border:0;border-radius:0;padding:10px;resize:none;white-space:pre;overflow:auto;outline:0}
#src::selection{background:rgba(120,140,255,.45)}
.hk{color:#ff9ac1}.hs{color:#a5e075}.hn{color:#f5c26b}.hc{color:#7f8bb0;font-style:italic}.ht{color:#7cc4ff}
.sts{font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--mute)}.sts.good{color:var(--ok)}.sts.bad{color:var(--bad)}.dc{color:#ffd37a}
.ma{margin-top:6px;display:flex;gap:6px}.ma button{min-height:32px;padding:4px 10px;font-size:13px}.mi{height:22px;width:auto;vertical-align:middle;background:#fff;border-radius:6px;padding:2px}
#bn{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:15}
#bn button{flex:1;display:flex;flex-direction:column;align-items:center;border:0;background:transparent;min-height:50px;padding:4px;font-size:18px;line-height:1.2}#bn span{font-size:12px}
.ia{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 6px}.tp{padding-left:22px;margin:8px 0 0}.tp li{margin-bottom:8px;font-size:14px}button{transition:transform .12s}button:active{transform:scale(.97)}@media(hover:hover){button:hover{transform:translateY(-1px)}}.chat{height:48vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}.mg{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:15px;max-width:92%;overflow-wrap:anywhere}.mg.u{background:var(--pri);color:var(--onpri);margin-left:auto}.mg.a{background:var(--bg);border:1px solid var(--line)}.dv{display:flex;align-items:center;gap:14px;margin-bottom:10px}.ph{object-fit:cover;flex:none;width:84px;height:84px;border-radius:50%;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;border:3px solid var(--gold)}.rv{border-left:4px solid var(--red);padding:4px 10px;margin:8px 0;font-size:14px}#fab{position:fixed;right:10px;bottom:calc(74px + env(safe-area-inset-bottom,0px));height:34px;padding:3px 8px;border-radius:17px;background:#fff;border:2px solid var(--red);display:flex;align-items:center;gap:5px;opacity:.75;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:20;transition:height .15s,padding .15s,opacity .15s}#fab img{height:20px;width:auto;transition:height .15s}#fab:hover,#fab:focus-visible,#fab:active{height:52px;padding:4px 10px;border-radius:26px;opacity:1}#fab:hover img,#fab:focus-visible img,#fab:active img{height:30px}#pn{position:fixed;right:12px;bottom:calc(134px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 28px));background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:20}#pn[hidden]{display:none}.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ph2 button{min-height:36px;padding:4px 10px}#pn .chat{height:min(46vh,360px)}
</style>

10:['Todo algoritmo VisualG começa com Algoritmo "nome" e termina com Fimalgoritmo.','Declara as variáveis na secção Var, antes de Inicio.','Usa leia() para pedir dados e escreva() ou escreval() para mostrar resultados.','escreval muda de linha no fim; escreva não muda.','A atribuição faz-se com <-, por exemplo x <- 5.','Para comparar usa = (igual) e <> (diferente).','O resto da divisão obtém-se com % e a divisão inteira com \\.','Um número é par quando n % 2 = 0.','Combina condições com e, ou e nao.','Cada Se precisa de entao e termina com FimSe.','Senao é o caminho alternativo e não leva condição.','Usa Para quando sabes quantas vezes repetir; termina com FimPara.','Enquanto testa a condição antes e pode não executar nenhuma vez.','Repita...Ate testa no fim e executa pelo menos uma vez.','Num Enquanto, atualiza sempre a variável da condição para evitar ciclos infinitos.','Num acumulador, começa com s <- 0 antes do ciclo.','Para o maior de dois números, compara com Se (a > b).','A média de três notas é (n1 + n2 + n3) / 3: não esqueças os parênteses.','Testa o algoritmo com valores simples antes de usar valores difíceis.','Um comentário começa com // e não é executado.'],
